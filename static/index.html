<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now What? Metrics to Recommendations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --muted: #555; --line: #e4e4e4; --pat: #d4d4d4;
          --serif: "Newsreader", Georgia, "Times New Roman", serif;
          --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 var(--sans); }
  section { min-height: 100vh; min-height: 100svh; position: relative; display: grid; place-items: center; padding: 32px 20px; overflow: hidden; }

  /* ---------- landing ---------- */
  .landing .pattern { position: absolute; inset: 0; pointer-events: none; }
  .dots { background-image: radial-gradient(var(--pat) 1.2px, transparent 1.4px); background-size: 26px 26px;
          -webkit-mask-image: radial-gradient(ellipse 48% 42% at 50% 48%, transparent 55%, #000 100%);
                  mask-image: radial-gradient(ellipse 48% 42% at 50% 48%, transparent 55%, #000 100%); }
  .shape { position: absolute; color: var(--pat); }
  .rings { top: -120px; right: -120px; width: 460px; height: 460px; }
  .hatch { bottom: -40px; left: -40px; width: 300px; height: 300px; }
  .squares { bottom: 12%; right: 7%; width: 120px; height: 120px; }
  .landing .copy { position: relative; text-align: center; }
  h1 { margin: 0; font: 500 clamp(56px, 11vw, 120px)/1 var(--serif); letter-spacing: -0.03em; }
  .landing p { margin: 20px 0 0; font: 400 clamp(18px, 2.6vw, 24px)/1.3 var(--sans); }
  .caret { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); width: 48px; height: 48px;
           border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: 50%; display: grid; place-items: center; }
  .caret svg { width: 28px; height: 28px; }

  /* ---------- numbers + fixes cards ---------- */
  .brief-section { background: #fff; padding-top: 56px; padding-bottom: 56px; }
  .stack { width: min(680px, 100%); display: grid; gap: 20px; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 28px 32px 24px; background: #fff; }
  .card h2 { margin: 0; font: 500 30px/1.15 var(--serif); letter-spacing: -0.01em; }
  .sub { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 22px; }
  .metric + .metric { border-left: 1px solid var(--line); padding-left: 16px; }
  .metric .label { font-size: 13px; color: var(--muted); }
  .metric .value { font: 500 32px/1.2 var(--serif); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .metric .delta { font-size: 13px; font-variant-numeric: tabular-nums; }
  .metric .prev { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card ul { margin: 18px 0 0; padding-left: 22px; display: grid; gap: 14px; }
  .card li { font: 400 20px/1.45 var(--serif); padding-left: 4px; }
  .card li::marker { color: var(--ink); }
  .verify { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
  .verify svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }
  .skeleton { height: 18px; border-radius: 4px; background: #f0f0f0; margin: 16px 0; }
  .loading-note { color: var(--muted); font-size: 14px; margin: 0; }

  /* ---------- chat widget ---------- */
  .chat-btn { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--ink); color: #fff;
              display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.18); z-index: 20; }
  .chat-btn svg { width: 26px; height: 26px; }
  .chat-win { position: fixed; right: 24px; bottom: 96px; width: 360px; height: min(480px, calc(100svh - 120px)); background: #fff;
              border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.14); display: flex; flex-direction: column; z-index: 20; overflow: hidden; }
  .chat-win[hidden] { display: none; }
  .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--line); }
  .chat-head h2 { margin: 0; font: 600 15px/1.3 var(--sans); }
  .x { border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink); width: 32px; height: 32px; border-radius: 50%; }
  .log { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 90%; padding: 9px 13px; border-radius: 12px; font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.you { align-self: flex-end; background: var(--ink); color: #fff; }
  .msg.bot { align-self: flex-start; background: #f2f2f2; }
  .msg .note { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 12px; }
  .chip { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; text-align: left; }
  .chip:hover { border-color: var(--ink); }
  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .send { font: 500 14px var(--sans); padding: 9px 14px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 3px solid #8aa9ff; outline-offset: 2px; }

  @media (max-width: 600px) {
    .card { padding: 22px 20px 18px; } .card h2 { font-size: 26px; } .card li { font-size: 18px; }
    .metrics { grid-template-columns: 1fr; gap: 0; }
    .metric { padding: 12px 0; } .metric + .metric { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); }
    .rings { width: 300px; height: 300px; top: -90px; right: -90px; }
    .squares { display: none; }
    .chat-win { right: 12px; left: 12px; width: auto; bottom: 88px; }
    .chat-btn { right: 16px; bottom: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .caret svg { animation: nudge 2.2s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>

<section class="landing" aria-labelledby="title">
  <div class="pattern dots"></div>
  <svg class="shape rings" viewBox="0 0 460 460" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <circle cx="230" cy="230" r="60"/><circle cx="230" cy="230" r="110"/><circle cx="230" cy="230" r="160"/><circle cx="230" cy="230" r="210"/>
  </svg>
  <svg class="shape hatch" viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <path d="M0 40L260 300M0 80L220 300M0 120L180 300M0 160L140 300M0 200L100 300M0 240L60 300M0 280L20 300M40 0L300 260M80 0L300 220M120 0L300 180M160 0L300 140M200 0L300 100M240 0L300 60"/>
  </svg>
  <svg class="shape squares" viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <rect x="4" y="4" width="32" height="32"/><rect x="44" y="4" width="32" height="32"/><rect x="84" y="4" width="32" height="32"/>
    <rect x="4" y="44" width="32" height="32"/><rect x="44" y="44" width="32" height="32"/><rect x="4" y="84" width="32" height="32"/>
  </svg>
  <div class="copy">
    <h1 id="title">Now What?</h1>
    <p>Metrics to Recommendations</p>
  </div>
  <button class="caret" id="caret" type="button" aria-label="See this week's numbers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
  </button>
</section>

<section class="brief-section" id="brief-section" aria-label="This week's results">
  <div class="stack">
    <div class="card" aria-labelledby="nums-h">
      <h2 id="nums-h">This week in numbers</h2>
      <p class="sub" id="weeks"></p>
      <div id="numbers"><div class="skeleton"></div><div class="skeleton" style="width:60%"></div></div>
    </div>
    <div class="card" aria-labelledby="fixes-h">
      <h2 id="fixes-h">Quick fixes</h2>
      <div id="brief" aria-live="polite">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:70%"></div>
        <p class="loading-note">Writing your fixes. This can take up to 30 seconds if the AI service is busy.</p>
      </div>
    </div>
  </div>
</section>

<button class="chat-btn" id="chat-btn" type="button" aria-label="Open chat" aria-expanded="false" aria-controls="chat-win">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.5-4.6A8 8 0 1 1 21 12z"/></svg>
</button>
<div class="chat-win" id="chat-win" role="dialog" aria-label="Ask about your numbers" hidden>
  <div class="chat-head"><h2>Ask about these numbers</h2><button class="x" id="chat-x" type="button" aria-label="Close chat">&times;</button></div>
  <div class="log" id="log" aria-live="polite">
    <div class="empty">Ask what a number means or what to check first. If your data can't answer, I'll say so.
      <div class="chips" id="chips"></div></div>
  </div>
  <form id="form">
    <input type="text" id="q" maxlength="300" placeholder="Ask a question" aria-label="Your question" autocomplete="off">
    <button class="send" id="send" type="submit">Ask</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SUGGESTIONS = ["Was it fewer visitors or fewer buyers?", "Which brands moved the most?", "What should I check first?"];
const history = [];
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
const WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>';

$("caret").onclick = () => $("brief-section").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });

function renderNumbers(d) {
  const h = d.headline;
  const arrow = (c) => (c < 0 ? "\u2193 " : "\u2191 ");
  const items = [
    ["Orders", h.orders, (c) => arrow(c) + Math.abs(Math.round(c)).toLocaleString()],
    ["Revenue", h.revenue, (c) => arrow(c) + "$" + Math.abs(Math.round(c)).toLocaleString()],
    ["Visit-to-order rate", h.conversion, (c) => arrow(c) + Math.abs(c * 100).toFixed(2) + " pts"],
  ];
  const wrap = el("div", "metrics");
  items.forEach(([label, m, fmt]) => {
    const box = el("div", "metric");
    box.append(el("div", "label", label), el("div", "value", m.curr),
               el("div", "delta", fmt(m.change) + " vs last week"), el("div", "prev", "Last week: " + m.prev));
    wrap.append(box);
  });
  $("numbers").replaceChildren(wrap);
  $("weeks").textContent = `Week of ${d.weeks.current} compared with week of ${d.weeks.previous}`;
}

function renderBrief(d) {
  const ul = el("ul");
  d.bullets.forEach((b) => ul.append(el("li", null, b)));
  const fallback = d.source !== "llm";
  const v = el("div", "verify");
  v.insertAdjacentHTML("beforeend", fallback ? WARN : CHECK);
  v.append(el("span", null, fallback ? (d.notice || "Written by code from your numbers.") : "Every number checked against your data."));
  $("brief").replaceChildren(ul, v);
}

async function loadBrief() {
  try {
    const r = await fetch("/api/brief");
    if (!r.ok) throw new Error();
    const d = await r.json();
    renderNumbers(d);
    renderBrief(d);
  } catch (e) {
    $("numbers").replaceChildren(); $("brief").replaceChildren(el("p", null, "Couldn't load this week's results. Check that evidence.json exists next to app.py, then reload."));
  }
}

function toggleChat(open) {
  $("chat-win").hidden = !open;
  $("chat-btn").setAttribute("aria-expanded", String(open));
  $("chat-btn").setAttribute("aria-label", open ? "Close chat" : "Open chat");
  if (open) $("q").focus(); else $("chat-btn").focus();
}
$("chat-btn").onclick = () => toggleChat($("chat-win").hidden);
$("chat-x").onclick = () => toggleChat(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("chat-win").hidden) toggleChat(false); });

function addMsg(kind, text, notice) {
  const log = $("log");
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  const m = el("div", "msg " + kind, text);
  if (notice) m.append(el("span", "note", notice));
  log.append(m); log.scrollTop = log.scrollHeight;
  return m;
}

async function ask(question) {
  question = question.trim(); if (!question) return;
  $("q").value = ""; $("send").disabled = true;
  addMsg("you", question);
  const wait = addMsg("bot", "Checking your numbers...");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ question, history }) });
    const d = await r.json();
    wait.remove();
    if (!r.ok) addMsg("bot", d.error || "Something went wrong. Try again.");
    else { addMsg("bot", d.text, d.source !== "llm" ? d.notice : null); history.push([question, d.text]); }
  } catch (e) { wait.remove(); addMsg("bot", "Couldn't reach the server. Try again in a moment."); }
  $("send").disabled = false; $("q").focus();
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); ask($("q").value); });
SUGGESTIONS.forEach((s) => { const c = el("button", "chip", s); c.type = "button"; c.onclick = () => ask(s); $("chips").append(c); });
loadBrief();
</script>
</body>
</html>
